version: "3.8"

services:
  # ============================================================================
  # Primary Service: FastAPI Backend + Unified Modern Luxury UI (Port 8000)
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zomato-ai-concierge
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.8-27b}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-10.0}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.3}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-400}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENABLE_QUERY_CACHE=${ENABLE_QUERY_CACHE:-true}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-3600}
    volumes:
      # Optional: mount local processed data directory for instant hot-reload
      - ./data/processed:/app/data/processed
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================================================
  # Optional Service: Streamlit Dashboard UI (Port 8501)
  # Run with: docker compose --profile full up
  # ============================================================================
  streamlit-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zomato-streamlit-ui
    restart: unless-stopped
    profiles: ["full"]
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
    command: ["streamlit", "run", "ui/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    depends_on:
      api:
        condition: service_healthy
