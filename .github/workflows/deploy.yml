name: CI/CD Pipeline & Automated Deployment

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Test Suite & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          GROQ_API_KEY: "mock_ci_key"
        run: |
          pytest -v tests/test_data_pipeline.py tests/test_retrieval.py

  build-docker:
    name: Build & Verify Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: zomato-ai-concierge:latest

      - name: Test Container Startup & Healthcheck
        run: |
          docker run -d --name test-app -p 8000:8000 -e GROQ_API_KEY=mock_key zomato-ai-concierge:latest
          sleep 10
          docker ps
          curl -f http://localhost:8000/health || (docker logs test-app && exit 1)
          docker stop test-app
